; MM9 interface fix - settings
; Re-read while the game runs, except where noted. A setting left out uses its default.

[HUD]
; 0 = turn the whole fix off (needs a game restart)
enable=1
; HUD size: 1.0 = original pixel size, max = as large as fits the screen (default).
; Also set with Left Ctrl + mouse wheel or in Options -> Game Options. The dialogue window,
; combat history and combat log follow this size too.
size=max
; how much one wheel notch changes the HUD size
size_step=0.05
; gap between the HUD and the screen edges, in screen pixels
margin_x=0
margin_y=0

[UI]
; menus, dialogs and the cursor:
;   fit       = one 4:3 block, aspect ratio kept (scale and align below apply)
;   stretched = stretched to the whole screen (scale and align are ignored)
mode=fit
; size of the 4:3 block, like [HUD] size: 1.0 = original pixel size (as at 800x600),
; max = as large as fits the screen (default)
scale=max
; where that block sits horizontally: center, left or right
align=center
; 1 = the loot window (chest + inventory) sits at the right screen edge (read at game start)
loot_right=1

[FOV]
; hor+     = the original view at 800x600, wider screens see more at the sides
; correct  = like hor+, but without the game's slight upward stretch (round things are round)
; original = the game's own behaviour
; (Options -> Game Options -> FOV Type: Original = original, Original Fixed = hor+, Correct = correct)
mode=hor+
; 1.1 = 10% wider view, 0.9 = 10% narrower (applied when the game next sets the view,
; e.g. loading a save; the slider and the FOV keys apply it at once)
scale=1.0
; range of the FOV slider and the FOV keys (must include 1.0)
min_fov_scale=0.5
max_fov_scale=1.7

[VIDEO]
; pre-rendered videos: fit = as large as possible with black bars, stretch = fill the screen,
; original = unscaled (read at game start)
mode=fit

[KEYS]
; Format: modifiers + trigger, e.g. LCtrl+Wheel, LAlt+MButton, Shift+F5. none = off
;   modifiers: LCtrl RCtrl Ctrl LAlt RAlt Alt LShift RShift Shift (unlisted ones must be up)
;   triggers:  Wheel (hud_size and fov only), MButton (wheel click), XButton1, XButton2,
;              A..Z, 0..9, F1..F24, Num0..Num9, Home, End, Insert, Delete, PageUp, PageDown,
;              Space, Tab, Backspace, Enter, or 0xNN (Windows virtual-key code)
hud_size=LCtrl+Wheel
hud_reset=LCtrl+MButton
fov=LAlt+Wheel
fov_reset=LAlt+MButton
; how much one wheel notch changes the FOV
fov_step=0.05
; 1 = wheel up zooms in instead of widening the view
fov_wheel_invert=0

; Troubleshooting (add under the section named when needed):
;   [HUD]   dump=1          write one frame of the HUD layout to cshell_hud.log
;   [HUD]   mouse_log=1     log mouse clicks, hit tests and cursor moves
;   [HUD]   perf=1          log drawing times once a second
;   [UI]    bars_log=1      log what the full-screen menu detection sees
;   [UI]    black_bars=0    leave the sides of full-screen menus as the engine draws them
;   [VIDEO] camera_nudge=0  turn off the 1 px edge fix of the 3D view
;   [SOUND] apply_volume=0  don't apply the saved master volume at game start
;
; Advanced (defaults shown; window classes are vtable addresses from cshell_hud.log / dump=1):
;   [HUD] mouse=1                          convert mouse input for the HUD's corner layout
;   [HUD] windows=100C0F04:bottom-center,100C98E0,100C0198
;                                          windows that follow the HUD size, class[:anchor]
;                                          (read at game start)
;   [HUD] split_left=266  split_right=533  split_top=200  split_bottom=400
;   [HUD] split_side_left=530  split_side_right=400  split_side_right_low=530  npc_column_x=690
;                                          HUD zone borders in 800x600 coordinates
;   [HUD] bottom_right=700,470,80,80       pieces always pinned to the bottom-right (x,y,w,h;...)
;   [UI]  align_left=  align_right=  align_center=
;                                          window classes with their own alignment (read at game start)
